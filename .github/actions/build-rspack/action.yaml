name: 'Build Rspack'
description: 'Checkout, download rspack binding, and build rspack js'
inputs:
  repository:
    description: 'The rspack repository to use'
    required: true
    default: 'web-infra-dev/rspack'
  path:
    description: 'Destination path to the rspack repository'
    required: true
    default: 'workspace/rspack'
  ref:
    description: 'The branch, tag or SHA to checkout'
    required: true
    default: 'main'
  pr-number:
    description: 'Pull request number used as a fallback when ref no longer exists'
    required: false
    default: ''
  base-repository:
    description: 'Base repository containing the pull request refs'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'The name of the uploaded artifact'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 22.22.3
    - shell: bash
      name: Install package manager
      run: |
        npm install -g corepack@latest --force
        echo "Corepack version: $(corepack --version)"
        corepack enable

    - name: Checkout Rspack repo
      id: checkout-rspack
      continue-on-error: true
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: ${{ inputs.repository }}
        path: ${{ inputs.path }}
        ref: ${{ inputs.ref }}
    - name: Checkout Rspack PR ref
      if: ${{ steps.checkout-rspack.outcome == 'failure' && inputs.pr-number != '' && inputs.base-repository != '' }}
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: ${{ inputs.base-repository }}
        path: ${{ inputs.path }}
        ref: refs/pull/${{ inputs.pr-number }}/head
    - name: Report unresolved Rspack ref
      if: ${{ steps.checkout-rspack.outcome == 'failure' && (inputs.pr-number == '' || inputs.base-repository == '') }}
      shell: bash
      run: |
        echo "::error::Failed to checkout ${{ inputs.repository }} at ${{ inputs.ref }} and no PR fallback was provided."
        exit 1

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: binding-linux-x64-gnu
        path: ${{ inputs.path }}/npm/linux-x64-gnu
    - name: Show restored binding
      shell: bash
      run: ls -lah ${{ inputs.path }}/npm/linux-x64-gnu/*.node
    - name: Build Rspack JS
      shell: bash
      run: |
        cd ${{ inputs.path }}
        pnpm i
        pnpm run build:js
