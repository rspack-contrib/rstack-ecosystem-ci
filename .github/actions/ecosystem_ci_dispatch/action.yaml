name: 'ecosystem_ci_dispatch'
description: 'Trigger downstream ecosystem CI from a manual dispatch and manage PR comments'

inputs:
  github-token:
    description: 'Token with access to the downstream ecosystem CI repository'
    required: true
  ecosystem-owner:
    description: 'Owner of the downstream ecosystem CI repository'
    required: false
    default: 'rstackjs'
  ecosystem-repo:
    description: 'Repository containing the downstream workflow'
    required: true
  workflow-file:
    description: 'Workflow file to execute in the downstream repository'
    required: true
  client-payload:
    description: 'JSON payload passed to the downstream workflow dispatch'
    required: false
    default: '{}'
  job-name-prefix:
    description: 'Job name prefix to match when summarizing downstream jobs'
    required: false
    default: 'execute-all '
  pr-number:
    description: 'Explicit PR number to comment on. When set, skips branch-based PR lookup.'
    required: false
    default: ''
  branch:
    description: 'Branch name to match against open pull requests when locating the PR number. Used only when pr-number is not set.'
    required: false
    default: ''

outputs:
  workflow-id:
    description: 'ID of the triggered downstream workflow run'
    value: ${{ steps.dispatch.outputs.run_id }}
  workflow-url:
    description: 'URL of the triggered downstream workflow run'
    value: ${{ steps.dispatch.outputs.run_url }}
  conclusion:
    description: 'Conclusion reported by the downstream workflow'
    value: ${{ steps.eco_ci.outcome }}
  summary:
    description: 'Formatted markdown summary of downstream job results'
    value: ${{ steps.eco-ci-result.outputs.summary }}
  comment-id:
    description: 'Identifier of the PR comment that was created or updated'
    value: ${{ steps.create-comment.outputs.result }}
  detected-pr-number:
    description: 'Pull request number auto-detected from the branch lookup'
    value: ${{ steps.get-pr-number.outputs.result }}

runs:
  using: composite
  steps:
    - id: get-pr-number
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      name: Get PR Number
      with:
        script: |
          const explicitPr = '${{ inputs.pr-number }}';
          if (explicitPr) {
            const num = Number(explicitPr);
            const { data: pr } = await github.rest.pulls.get({
              owner: '${{ inputs.ecosystem-owner }}',
              repo: '${{ inputs.ecosystem-repo }}',
              pull_number: num,
            });
            console.log(`Using explicit PR #${num}: ${pr.html_url}`);
            return {
              num,
              branchName: pr.head.ref,
              repo: pr.head.repo.full_name
            };
          }

          const { data: prs } = await github.rest.pulls.list({
            owner: '${{ inputs.ecosystem-owner }}',
            repo: '${{ inputs.ecosystem-repo }}',
          })

          const pr = prs.find(pr => pr.head.ref === '${{ inputs.branch }}');

          if(pr) {
            console.log(`Get PR info: ${pr.url}`)

            return {
              num: pr.number,
              branchName: pr.head.ref,
              repo: pr.head.repo.full_name
            }
          } else {
            console.log(`can't find PR for branch: ${{ inputs.branch }}`)
          }

    - id: create-comment
      name: Create Comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      if: steps.get-pr-number.outputs.result
      with:
        result-encoding: string
        script: |
          const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          const urlLink = `[Open](${url})`
          const prData = ${{ steps.get-pr-number.outputs.result }}

          const { data: comment } = await github.rest.issues.createComment({
            issue_number: prData.num,
            owner: '${{ inputs.ecosystem-owner }}',
            repo: '${{ inputs.ecosystem-repo }}',
            body: `⏳ Triggered ecosystem CI: ${urlLink}`
          })
          return comment.id

    - id: dispatch
      name: Dispatch Ecosystem CI
      uses: Codex-/return-dispatch@16fa9d14771c4d56ae0196bbda1d3c17f7f3650f # v3.0.2
      continue-on-error: true
      with:
        token: ${{ inputs.github-token }}
        ref: main
        owner: rstackjs
        repo: rstack-ecosystem-ci
        workflow: ${{ inputs.workflow-file }}
        workflow_inputs: ${{ inputs.client-payload }}

    - id: eco_ci
      name: Await Ecosystem CI
      uses: Codex-/await-remote-run@2512346665df8818ec7ad6aca3cdceb7626cd384 # v2.0.0
      continue-on-error: true
      with:
        token: ${{ inputs.github-token }}
        owner: rstackjs
        repo: rstack-ecosystem-ci
        run_id: ${{ steps.dispatch.outputs.run_id }}
        run_timeout_seconds: 10800
        poll_interval_ms: 30000

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1

    - id: eco-ci-result
      uses: rstackjs/rstack-ecosystem-ci/.github/actions/ecosystem-ci-result@3cbb84659edaf3713e10831715d39de0d5c02df7 # main
      name: Get CI Result
      with:
        job-prefix: ${{ inputs.job-name-prefix }}
        heading: ${{ inputs.ecosystem-repo }}
        workflow-output: '{"run_id": "${{ steps.dispatch.outputs.run_id }}"}'

    - id: update-comment
      name: Update Comment
      if: steps.get-pr-number.outputs.result
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        COMMENT_ID: ${{ steps.create-comment.outputs.result }}
        SUMMARY: ${{ steps.eco-ci-result.outputs.summary }}
      with:
        script: |
          await github.rest.issues.updateComment({
            owner: '${{ inputs.ecosystem-owner }}',
            repo: '${{ inputs.ecosystem-repo }}',
            comment_id: process.env.COMMENT_ID,
            body: process.env.SUMMARY
          })
