name: Update Ecosystem History

# Reusable workflow shared by every `*-ecosystem-ci-from-commit.yml`.
# It summarizes the current run, builds the data-branch payload, and pushes it to
# the `data` branch using this repo's own GITHUB_TOKEN. Callers only vary by stack.
on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      repo:
        required: true
        type: string
      commitSHA:
        required: true
        type: string

jobs:
  update-history:
    name: Update Ecosystem History
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Get CI Result
        id: eco-ci-result
        uses: ./.github/actions/ecosystem-ci-result
        with:
          heading: ${{ inputs.stack }}
          workflow-output: '{"workflow_id": "${{ github.run_id }}"}'
      - name: Update Ecosystem History
        id: update-history
        env:
          STACK: ${{ inputs.stack }}
          SOURCE_REPO: ${{ inputs.repo }}
          SOURCE_COMMIT: ${{ inputs.commitSHA }}
          SUMMARY_MARKDOWN: ${{ steps.eco-ci-result.outputs.summary }}
          RESULTS_JSON: ${{ steps.eco-ci-result.outputs.results }}
          HISTORY_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: data-artifacts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-ecosystem-history.mjs
      - name: Publish History
        if: ${{ steps.update-history.outcome == 'success' }}
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: data
          folder: data-artifacts
          clean: false
          target-folder: .
          token: ${{ secrets.GITHUB_TOKEN }}
          repository-name: ${{ github.repository }}
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
