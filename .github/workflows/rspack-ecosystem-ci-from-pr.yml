# integration tests for rspack ecosystem - run from pr comments
name: rspack-ecosystem-ci-from-pr

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: 'PR number (e.g. 9887)'
        required: true
        type: string
      branchName:
        description: 'rspack branch to use'
        required: true
        type: string
        default: 'main'
      repo:
        description: 'rspack repository to use'
        required: true
        type: string
        default: 'web-infra-dev/rspack'
      suite:
        description: 'testsuite to run. runs all test suites when `-`.'
        required: false
        type: choice
        options:
          - '-'
          - modernjs
          - rspress
          - rsbuild
          - rslib
          - rstest
          - rsdoctor
          - examples
          - devserver
          - plugin
          - lynx-stack
          - rsbuild-rsc-plugin
      suiteRefType:
        description: 'type of suite ref to use'
        required: true
        type: choice
        options:
          - precoded
          - branch
          - tag
          - commit
        default: 'precoded'
      suiteRef:
        description: 'suite ref to use'
        required: true
        type: string
        default: 'precoded'

jobs:
  get-runner-labels:
    name: Get Runner Labels
    uses: ./.github/workflows/get-runner-labels.yml

  prepare-binding:
    name: Prepare Rspack Binding
    needs: get-runner-labels
    runs-on: ${{ fromJSON(needs.get-runner-labels.outputs.LINUX_RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/prepare-rspack-binding
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branchName }}

  execute-selected-suite:
    runs-on: ubuntu-latest
    needs: prepare-binding
    name: execute-all (${{ inputs.suite }})
    if: "inputs.suite != '-'"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/build-rspack
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branchName }}
      - name: Setup Rust
        if: inputs.suite == 'lynx-stack'
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      # Verdaccio is required for rspack-stack testing.
      # pnpm has a known bug (pnpm/pnpm#9270) where file: protocol overrides
      # for packages with native optionalDependencies cause version mismatch
      # or silent registry fallback. Publishing to a local registry avoids this.
      - name: Publish rspack to Verdaccio
        id: publish-rspack
        uses: ./.github/actions/publish-rspack-to-verdaccio
      - name: Run suite
        run: >-
          NPM_CONFIG_REGISTRY=http://localhost:4873
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rspack
          --release "${{ steps.publish-rspack.outputs.version }}"
          --suite-${{ inputs.suiteRefType }} ${{ inputs.suiteRef }}
          ${{ inputs.suite }}

  execute-all:
    needs: [get-runner-labels, prepare-binding]
    if: "inputs.suite == '-'"
    strategy:
      matrix:
        include:
          - suite: modernjs
            os: ubuntu-latest
          - suite: rspress
            os: ubuntu-latest
          - suite: rslib
            os: ubuntu-latest
          - suite: rstest
            os: ubuntu-latest
          - suite: rsbuild
            os: ubuntu-latest
          - suite: rsdoctor
            os: ubuntu-latest
          - suite: examples
            os: ubuntu-latest
          - suite: devserver
            os: ubuntu-latest
          - suite: plugin
            os: ubuntu-latest
          - suite: lynx-stack
            os: ubuntu-latest
          - suite: rsbuild-rsc-plugin
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: execute-all (${{ matrix.suite }})
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
      - uses: ./.github/actions/build-rspack
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branchName }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Publish rspack to Verdaccio
        id: publish-rspack
        uses: ./.github/actions/publish-rspack-to-verdaccio
      - name: Run suite
        run: |
          suite_ref_args=()
          if [ "${{ inputs.suiteRefType }}" != "precoded" ]; then
            suite_ref_args=(--suite-${{ inputs.suiteRefType }} "${{ inputs.suiteRef }}")
          fi
          NPM_CONFIG_REGISTRY=http://localhost:4873 \
            pnpm tsx ecosystem-ci.ts run-suites \
            --stack rspack \
            --release "${{ steps.publish-rspack.outputs.version }}" \
            "${suite_ref_args[@]}" \
            ${{ matrix.suite }}
