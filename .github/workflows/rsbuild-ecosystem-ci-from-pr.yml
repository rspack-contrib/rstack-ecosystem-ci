# integration tests for rsbuild ecosystem - run against a PR branch (manually dispatched)
name: rsbuild-ecosystem-ci-from-pr

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: 'PR number (e.g. 9887)'
        required: true
        type: string
      branchName:
        description: 'rsbuild branch to use'
        required: true
        type: string
        default: 'main'
      repo:
        description: 'rsbuild repository to use'
        required: true
        type: string
        default: 'web-infra-dev/rsbuild'
      suite:
        description: 'testsuite to run. runs all test suites when `-`.'
        required: false
        type: choice
        options:
          - '-'
          - rslib
          - rstest
          - rspress
          - plugins
          - modernjs
          - examples
          - lynx-stack
      suiteRefType:
        description: 'type of suite ref to use'
        required: true
        type: choice
        options:
          - precoded
          - branch
          - tag
          - commit
        default: 'precoded'
      suiteRef:
        description: 'suite ref to use'
        required: true
        type: string
        default: 'precoded'
      distinct_id:
        description: 'Distinct ID injected by return-dispatch to identify this run'
        required: false
        type: string
        default: ''

jobs:
  return-dispatch-id:
    permissions: {}
    name: Return Dispatch ID
    runs-on: ubuntu-latest
    steps:
      - name: Return Dispatch ID ${{ inputs.distinct_id }}
        run: echo "${DISTINCT_ID}"
        env:
          DISTINCT_ID: ${{ inputs.distinct_id }}

  execute-selected-suite:
    runs-on: ubuntu-latest
    if: "inputs.suite != '-'"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-rsbuild
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branchName }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rsbuild
          --suite-${{ inputs.suiteRefType }} ${{ inputs.suiteRef }}
          ${{ inputs.suite }}

  execute-all:
    if: "inputs.suite == '-'"
    strategy:
      matrix:
        include:
          - suite: rslib
            os: ubuntu-latest
          - suite: rstest
            os: ubuntu-latest
          - suite: rspress
            os: ubuntu-latest
          - suite: plugins
            os: ubuntu-latest
          - suite: modernjs
            os: ubuntu-latest
          - suite: examples
            os: ubuntu-latest
          - suite: lynx-stack
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: execute-all (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-rsbuild
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branchName }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rsbuild
          ${{ matrix.suite }}
