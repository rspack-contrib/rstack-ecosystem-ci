# integration tests for rspress ecosystem - run from pr comments
name: rspress-ecosystem-ci-from-commit

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

on:
  workflow_dispatch:
    inputs:
      commitSHA:
        description: 'commit sha'
        required: true
        type: string
      repo:
        description: 'rspress repository to use'
        required: true
        type: string
        default: 'web-infra-dev/rspress'
      suite:
        description: 'testsuite to run. runs all test suites when `-`.'
        required: false
        type: choice
        options:
          - '-'
          - rsbuild
          - rslib
          - rspack
          - rstest
      suiteRefType:
        description: 'type of suite ref to use'
        required: true
        type: choice
        options:
          - precoded
          - branch
          - tag
          - commit
        default: 'precoded'
      suiteRef:
        description: 'suite ref to use'
        required: true
        type: string
        default: 'precoded'
      updateComment:
        description: 'update comment'
        required: false
        type: boolean
        default: false

jobs:
  execute-selected-suite:
    runs-on: ubuntu-latest
    if: "inputs.suite != '-'"
    env:
      ECOSYSTEM_CI_REF: ${{ inputs.commitSHA }}
      ECOSYSTEM_CI_TYPE: 'commit'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/build-rspress
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.commitSHA }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rspress
          --suite-${{ inputs.suiteRefType }} ${{ inputs.suiteRef }}
          ${{ inputs.suite }}

  execute-all:
    if: "inputs.suite == '-'"
    strategy:
      matrix:
        include:
          - suite: rsbuild
            os: ubuntu-latest
          - suite: rslib
            os: ubuntu-latest
          - suite: rspack
            os: ubuntu-latest
          - suite: rstest
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: execute-all (${{ matrix.suite }})
    env:
      ECOSYSTEM_CI_REF: ${{ inputs.commitSHA }}
      ECOSYSTEM_CI_TYPE: 'commit'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
      - uses: ./.github/actions/build-rspress
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.commitSHA }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rspress
          ${{ matrix.suite }}

  update-history:
    name: Update Ecosystem History
    needs: [execute-all]
    if: ${{ always() && inputs.suite == '-' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Get CI Result
        id: eco-ci-result
        uses: ./.github/actions/ecosystem-ci-result
        with:
          heading: rspress
          workflow-output: '{"workflow_id": "${{ github.run_id }}"}'
      - name: Update Ecosystem History
        id: update-history
        env:
          STACK: rspress
          SOURCE_REPO: ${{ inputs.repo }}
          SOURCE_COMMIT: ${{ inputs.commitSHA }}
          SUMMARY_MARKDOWN: ${{ steps.eco-ci-result.outputs.summary }}
          RESULTS_JSON: ${{ steps.eco-ci-result.outputs.results }}
          HISTORY_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: data-artifacts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-ecosystem-history.mjs
      - name: Publish History
        if: ${{ steps.update-history.outcome == 'success' }}
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: data
          folder: data-artifacts
          clean: false
          target-folder: .
          token: ${{ secrets.GITHUB_TOKEN }}
          repository-name: ${{ github.repository }}
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
