# integration tests for rsdoctor ecosystem - run from commit comments
name: rsdoctor-ecosystem-ci-from-commit

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

on:
  workflow_dispatch:
    inputs:
      commitSHA:
        description: 'commit sha'
        required: true
        type: string
      repo:
        description: 'rsdoctor repository to use'
        required: true
        type: string
        default: 'web-infra-dev/rsdoctor'
      suite:
        description: 'testsuite to run. runs all test suites when `-`.'
        required: false
        type: choice
        options:
          - '-'
          - rsbuild
      suiteRefType:
        description: 'type of suite ref to use'
        required: true
        type: choice
        options:
          - precoded
          - branch
          - tag
          - commit
        default: 'precoded'
      suiteRef:
        description: 'suite ref to use'
        required: true
        type: string
        default: 'precoded'
      updateComment:
        description: 'update comment'
        required: false
        type: boolean
        default: false
      distinct_id:
        description: 'Distinct ID injected by return-dispatch to identify this run'
        required: false
        type: string
        default: ''

jobs:
  return-dispatch-id:
    name: Return Dispatch ID
    runs-on: ubuntu-latest
    steps:
      - name: Return Dispatch ID ${{ inputs.distinct_id }}
        run: echo "${DISTINCT_ID}"
        env:
          DISTINCT_ID: ${{ inputs.distinct_id }}

  execute-selected-suite:
    runs-on: ubuntu-latest
    if: ${{ inputs.suite != '-' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/build-rsdoctor
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.commitSHA }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rsdoctor
          --suite-${{ inputs.suiteRefType }} ${{ inputs.suiteRef }}
          ${{ inputs.suite }}

  execute-all:
    if: ${{ inputs.suite == '-' }}
    strategy:
      matrix:
        include:
          - suite: rsbuild
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: execute-all (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/build-rsdoctor
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.commitSHA }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rsdoctor
          ${{ matrix.suite }}

  update-history:
    needs: [execute-all]
    if: ${{ always() && inputs.suite == '-' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/_update-history.yml
    with:
      stack: rsdoctor
      repo: ${{ inputs.repo }}
      commitSHA: ${{ inputs.commitSHA }}
