name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rsbuild:
    strategy:
      matrix:
        include:
          - suite: rslib
            os: ubuntu-latest
          - suite: rstest
            os: ubuntu-latest
          - suite: rspress
            os: ubuntu-latest
          - suite: plugins
            os: ubuntu-latest
          - suite: modernjs
            os: ubuntu-latest
          - suite: examples
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: rsbuild (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/build-rsbuild
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rsbuild
          ${{ matrix.suite }}

  rslib:
    strategy:
      matrix:
        include:
          - suite: rsbuild
            os: ubuntu-latest
          - suite: rspack
            os: ubuntu-latest
          - suite: rstest
            os: ubuntu-latest
          - suite: rspress
            os: ubuntu-latest
          - suite: rsdoctor
            os: ubuntu-latest
          - suite: modernjs
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: rslib (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/build-rslib
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rslib
          ${{ matrix.suite }}

  rstest:
    strategy:
      matrix:
        include:
          - suite: rslib
            os: ubuntu-latest
          - suite: rsbuild
            os: ubuntu-latest
          - suite: rsdoctor
            os: ubuntu-latest
          - suite: rspress
            os: ubuntu-latest
          - suite: examples
            os: ubuntu-latest
          - suite: modernjs
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: rstest (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/build-rstest
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rstest
          ${{ matrix.suite }}

  rsdoctor:
    strategy:
      matrix:
        include:
          - suite: rsbuild
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: rsdoctor (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/build-rsdoctor
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rsdoctor
          ${{ matrix.suite }}

  get-runner-labels:
    name: Get Runner Labels
    uses: ./.github/workflows/get-runner-labels.yml

  prepare-rspack-binding:
    name: Prepare Rspack Binding
    needs: get-runner-labels
    runs-on: ${{ fromJSON(needs.get-runner-labels.outputs.LINUX_RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/prepare-rspack-binding

  rspack:
    needs:
      - get-runner-labels
      - prepare-rspack-binding
    strategy:
      matrix:
        include:
          - suite: modernjs
            os: ubuntu-latest
          - suite: _selftest
            os: ubuntu-latest
          - suite: rspress
            os: ubuntu-latest
          - suite: rsbuild
            os: ubuntu-latest
          - suite: examples
            os: ubuntu-latest
          - suite: rslib
            os: ubuntu-latest
          - suite: rstest
            os: ubuntu-latest
          - suite: rsdoctor
            os: ubuntu-latest
          - suite: devserver
            os: ubuntu-latest
          - suite: plugin
            os: ubuntu-latest
          - suite: lynx-stack
            os: ubuntu-latest
          - suite: rsbuild-rsc-plugin
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: rspack (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/build-rspack
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        if: matrix.suite == '_selftest'
        run: pnpm lint
      - name: Setup Node.js
        if: matrix.suite == 'lynx-stack' || matrix.suite == '_selftest'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.3
      - name: Setup Rust
        if: matrix.suite == 'lynx-stack'
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      # Verdaccio is required for rspack-stack testing.
      # pnpm has a known bug (pnpm/pnpm#9270) where file: protocol overrides
      # for packages with native optionalDependencies cause version mismatch
      # or silent registry fallback. Publishing to a local registry avoids this.
      - name: Publish rspack to Verdaccio
        id: publish-rspack
        if: matrix.suite != '_selftest'
        uses: ./.github/actions/publish-rspack-to-verdaccio
      - name: Run suite (with Verdaccio)
        if: matrix.suite != '_selftest'
        run: >-
          NPM_CONFIG_REGISTRY=http://localhost:4873
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rspack
          --release "${{ steps.publish-rspack.outputs.version }}"
          ${{ matrix.suite }}
      - name: Run suite (selftest)
        if: matrix.suite == '_selftest'
        run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rspack
          ${{ matrix.suite }}
