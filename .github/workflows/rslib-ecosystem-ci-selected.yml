# integration tests for rslib ecosystem - run for selected one testsuite or all testsuites
name: rslib-ecosystem-ci-selected

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

on:
  workflow_dispatch:
    inputs:
      refType:
        description: 'type of rslib ref to use'
        required: true
        type: choice
        options:
          - branch
          - tag
          - commit
          - release
        default: 'branch'
      ref:
        description: 'rslib ref to use'
        required: true
        type: string
        default: 'main'
      repo:
        description: 'rslib repository to use'
        required: true
        type: string
        default: 'web-infra-dev/rslib'
      suite:
        description: 'testsuite to run. runs all test suites when `-`.'
        required: true
        type: choice
        options:
          - '-'
          - rsbuild
          - rspack
          - rstest
          - rspress
          - rsdoctor
          - modernjs
      suiteRefType:
        description: 'type of suite ref to use'
        required: true
        type: choice
        options:
          - precoded
          - branch
          - tag
          - commit
        default: 'precoded'
      suiteRef:
        description: 'suite ref to use'
        required: true
        type: string
        default: 'precoded'
      distinct_id:
        description: 'Distinct ID injected by return-dispatch to identify this run'
        required: false
        type: string
        default: ''

jobs:
  return-dispatch-id:
    name: Return Dispatch ID
    runs-on: ubuntu-latest
    steps:
      - name: Return Dispatch ID ${{ inputs.distinct_id }}
        run: echo "${DISTINCT_ID}"
        env:
          DISTINCT_ID: ${{ inputs.distinct_id }}

  execute-selected-suite:
    runs-on: ubuntu-latest
    if: "inputs.suite != '-'"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/build-rslib
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rslib
          --suite-${{ inputs.suiteRefType }} ${{ inputs.suiteRef }}
          ${{ inputs.suite }}

  execute-all:
    if: "inputs.suite == '-'"
    strategy:
      matrix:
        include:
          - suite: rsbuild
            os: ubuntu-latest
          - suite: rspack
            os: ubuntu-latest
          - suite: rstest
            os: ubuntu-latest
          - suite: rspress
            os: ubuntu-latest
          - suite: rsdoctor
            os: ubuntu-latest
          - suite: modernjs
            os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: execute-all (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/build-rslib
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
      - run: pnpm i --frozen-lockfile
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - run: >-
          pnpm tsx ecosystem-ci.ts
          run-suites
          --stack rslib
          ${{ matrix.suite }}
